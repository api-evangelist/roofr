name: Roofr
description: 'Roofr is an all-in-one roofing software and CRM built for roofing contractors, bundling
  aerial roof measurement reports, an instant online estimator, digital proposals with e-signature,
  integrated payments, material ordering, a job calendar, and pipeline/CRM tooling into one platform to
  help roofers win, run, and close jobs. Roofr does not publish a public developer API or self-serve
  documentation: the only API key it issues (under Settings and Integrations) exists to connect Roofr to
  Zapier, and any broader programmatic access is sales-gated behind a demo. Automation for external
  systems is delivered primarily through Zapier triggers (new Instant Estimator lead, proposal signed,
  proposal marked lost) rather than a documented REST API. Roofr is a portfolio company of Bullpen
  Capital.'
